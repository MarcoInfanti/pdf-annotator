<div
  class="sidebar-resizer"
  [class.sidebar-resizer--active]="resizing()"
  role="separator"
  tabindex="0"
  aria-orientation="vertical"
  [attr.aria-label]="'SIDEBAR.RESIZER_LABEL' | translate"
  [title]="'SIDEBAR.RESIZER_TITLE' | translate"
  data-testid="sidebar-resizer"
  [attr.aria-valuenow]="sidebarWidth.width()"
  [attr.aria-valuemin]="sidebarWidth.minWidth"
  [attr.aria-valuemax]="sidebarWidth.maxWidth()"
  (pointerdown)="startResize($event)"
  (pointermove)="resize($event)"
  (pointerup)="stopResize($event)"
  (keydown)="resizeWithKeys($event)"
  (dblclick)="sidebarWidth.reset()"
></div>
