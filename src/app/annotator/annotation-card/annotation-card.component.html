<header class="annotation-card__header">
  <button
    type="button"
    class="annotation-card__page"
    data-testid="annotation-card-page"
    (click)="focusRequested.emit()"
    [attr.aria-label]="'CARD.GO_TO_PAGE' | translate: { page: annotation().page }"
  >
    {{ 'CARD.PAGE' | translate: { page: annotation().page } }}
  </button>

  <div
    class="annotation-card__colors"
    role="radiogroup"
    [attr.aria-label]="'CARD.COLOR_GROUP' | translate"
  >
    @for (color of colors; track color.value) {
      <button
        type="button"
        role="radio"
        class="annotation-card__swatch"
        [style.background-color]="color.value"
        [attr.aria-checked]="color.value === annotation().color"
        [attr.aria-label]="color.labelKey | translate"
        [attr.data-testid]="'annotation-card-swatch-' + color.id"
        [title]="color.labelKey | translate"
        (click)="colorChanged.emit(color.value)"
      ></button>
    }
  </div>

  @if (!editing()) {
    <button
      type="button"
      class="icon-button"
      data-testid="annotation-card-edit"
      [title]="'CARD.EDIT' | translate"
      [attr.aria-label]="'CARD.EDIT' | translate"
      (click)="editRequested.emit()"
    >
      ✎
    </button>
  }
  <button
    type="button"
    class="icon-button icon-button--danger"
    data-testid="annotation-card-delete"
    [title]="'CARD.DELETE_TITLE' | translate"
    [attr.aria-label]="'CARD.DELETE' | translate"
    (click)="deleteRequested.emit()"
  >
    🗑
  </button>
</header>

<blockquote class="annotation-card__quote">
  <button
    type="button"
    class="annotation-card__quote-button"
    data-testid="annotation-card-quote"
    (click)="focusRequested.emit()"
  >
    {{ annotation().quote }}
  </button>
</blockquote>

@if (editing()) {
  <div class="annotation-card__tabs">
    <div
      class="annotation-card__tablist"
      role="tablist"
      [attr.aria-label]="'CARD.EDITOR_TABS' | translate"
      data-testid="annotation-card-tablist"
    >
      <button
        type="button"
        role="tab"
        [id]="writeTabId()"
        [attr.aria-controls]="panelId()"
        [attr.aria-selected]="!preview()"
        data-testid="annotation-card-tab-write"
        (click)="preview.set(false)"
      >
        {{ 'CARD.WRITE' | translate }}
      </button>
      <button
        type="button"
        role="tab"
        [id]="previewTabId()"
        [attr.aria-controls]="panelId()"
        [attr.aria-selected]="preview()"
        data-testid="annotation-card-tab-preview"
        (click)="preview.set(true)"
      >
        {{ 'CARD.PREVIEW' | translate }}
      </button>
    </div>
    @if (!preview()) {
      <button
        type="button"
        class="annotation-card__insert"
        data-testid="annotation-card-insert-table"
        [title]="'CARD.INSERT_TABLE_TITLE' | translate"
        (click)="insertTable()"
      >
        <span aria-hidden="true">⊞</span> {{ 'CARD.INSERT_TABLE' | translate }}
      </button>
    }
  </div>
  <div
    role="tabpanel"
    [id]="panelId()"
    [attr.aria-labelledby]="preview() ? previewTabId() : writeTabId()"
    data-testid="annotation-card-panel"
  >
    @if (preview()) {
      <div
        class="markdown annotation-card__preview"
        data-testid="annotation-card-preview"
        [innerHTML]="comment.value || ('CARD.NO_COMMENT' | translate) | markdown"
      ></div>
    } @else {
      <textarea
        #textarea
        class="annotation-card__editor"
        data-testid="annotation-card-editor"
        rows="6"
        [attr.aria-label]="'CARD.EDITOR_LABEL' | translate"
        [attr.placeholder]="'CARD.EDITOR_PLACEHOLDER' | translate"
        [formControl]="comment"
        (keydown)="handleEditorKeys($event)"
      ></textarea>
    }
  </div>
  <footer class="annotation-card__actions">
    <span class="annotation-card__hint" data-testid="annotation-card-hint">{{
      'CARD.HINT' | translate
    }}</span>
    <button
      type="button"
      class="button"
      data-testid="annotation-card-cancel"
      (click)="editCancelled.emit()"
    >
      {{ 'CARD.CANCEL' | translate }}
    </button>
    <button
      type="button"
      class="button button--primary"
      data-testid="annotation-card-save"
      (click)="save()"
    >
      {{ 'CARD.SAVE' | translate }}
    </button>
  </footer>
} @else if (annotation().comment) {
  <div
    class="markdown"
    data-testid="annotation-card-comment"
    [innerHTML]="annotation().comment | markdown"
  ></div>
} @else {
  <button
    type="button"
    class="annotation-card__add"
    data-testid="annotation-card-add-comment"
    (click)="editRequested.emit()"
  >
    {{ 'CARD.ADD_COMMENT' | translate }}
  </button>
}
