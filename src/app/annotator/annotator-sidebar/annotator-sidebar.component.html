<app-sidebar-resizer />
<aside
  class="sidebar"
  [attr.aria-label]="'SIDEBAR.LABEL' | translate"
  [style.width.px]="sidebarWidth.width()"
  data-testid="annotator-sidebar"
>
  <div class="sidebar__header">
    <h2>
      {{ 'SIDEBAR.TITLE' | translate }}
      <span class="sidebar__count" data-testid="annotator-sidebar-count">{{
        store.commentCount()
      }}</span>
    </h2>
    <input
      type="search"
      class="sidebar__search"
      data-testid="annotator-sidebar-search"
      [attr.placeholder]="'SIDEBAR.SEARCH_PLACEHOLDER' | translate"
      [attr.aria-label]="'SIDEBAR.SEARCH_LABEL' | translate"
      (input)="changeSearch($event)"
    />
  </div>
  <div class="sidebar__list" data-testid="annotator-sidebar-list">
    @for (annotation of store.visibleAnnotations(); track annotation.id) {
      <app-annotation-card
        [annotation]="annotation"
        [selected]="annotation.id === store.selectedId()"
        [editing]="annotation.id === store.editingId()"
        (focusRequested)="annotationFocused.emit(annotation)"
        (editRequested)="store.startEditing(annotation.id)"
        (commentSaved)="store.updateComment(annotation.id, $event)"
        (editCancelled)="store.stopEditing()"
        (deleteRequested)="remove(annotation)"
        (colorChanged)="store.changeColor(annotation.id, $event)"
      />
    } @empty {
      <p class="sidebar__empty" data-testid="annotator-sidebar-empty">
        @if (store.search()) {
          {{ 'SIDEBAR.NO_MATCH' | translate }}
        } @else {
          {{ 'SIDEBAR.EMPTY_HINT' | translate }}
        }
      </p>
    }
  </div>
</aside>
