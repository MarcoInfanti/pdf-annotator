<div
  class="highlight-popup__toolbar"
  role="toolbar"
  aria-label="Subrayar selección"
  data-testid="highlight-popup"
>
  <span>Subrayar</span>
  @for (color of colors; track color.value) {
    <button
      type="button"
      class="highlight-popup__color"
      [style.background-color]="color.value"
      [attr.aria-label]="'Subrayar en ' + color.label"
      [title]="color.label"
      [attr.data-testid]="'highlight-popup-color-' + color.id"
      (click)="colorPicked.emit(color.value)"
    ></button>
  }
</div>
